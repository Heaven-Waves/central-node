---
- name: Add bullseye-backports repository to sources list in order to install pipewire
  ansible.builtin.apt_repository:
    repo: "deb http://deb.debian.org/debian bullseye-backports main contrib non-free"
    filename: "bullseye-backports"
    state: present

- name: Install PipeWire and all its dependancies from bullseye-backports
  ansible.builtin.apt:
    name:
      - pipewire
      - wireplumber
      - pipewire-pulse
      - pipewire-alsa
    default_release: "bullseye-backports"
    state: present

- name: Install GStreamer and all its dependancies
  ansible.builtin.apt:
    name:
      - libgstreamer1.0-dev
      - libgstreamer-plugins-base1.0-dev
      - libgstreamer-plugins-bad1.0-dev
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-plugins-ugly
      - gstreamer1.0-libav
      - gstreamer1.0-tools
      - gstreamer1.0-x
      - gstreamer1.0-alsa
      - gstreamer1.0-gl
      - gstreamer1.0-pulseaudio
    state: present

- name: Update apt
  ansible.builtin.apt:
    update_cache: true

- name: Install optional packages
  ansible.builtin.apt:
    name:
      - vim
    state: present
