services:
  pi-emulator:
    image: ptrsr/pi-ci:1.4
    entrypoint: []
    command:
      - bash
      - -c
      - |
        /app/run.py resize 8G -y
        /app/run.py start
    ports:
      - 2222:2222
    volumes:
      - ./dist:/dist

  ansible:
    image: justivo/ansible
    build: .
    command: ansible-playbook playbook.yml
    depends_on:
      - pi-emulator
    volumes:
      - ./ansible:/etc/ansible/playbooks/
      - ./dist:/distro

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.1.0/24
          ip_range: 172.16.1.0/30
          gateway: 172.16.1.1
